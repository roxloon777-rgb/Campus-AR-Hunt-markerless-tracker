<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Treasure Hunt Map</title>
  <style>
    /* General layout */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background-color: #000; /* fills any empty space */
    }

    /* Map container */
    #map {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Map image — centered and scaled properly */
    #map img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: auto;
      height: 100%;
      object-fit: contain;
    }

    /* Hotspot buttons */
    .hotspot {
      position: absolute;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transform: translate(-50%, -50%);
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .hotspot:hover {
      background: rgba(255, 80, 80, 0.9);
      transform: translate(-50%, -50%) scale(1.1);
    }

    /* Green for collected */
    .collected {
      background: rgba(0, 200, 0, 0.8);
    }
  </style>
</head>
<body>

  <div id="map">
    <img src="assets/Map2.png" alt="Map">

    <!-- Hotspots positioned by percentage (adjust if needed) -->
    <div class="hotspot" id="law" style="top:10%; left:50%;" onclick="goToAR('law')">Law Fountain</div>
    <div class="hotspot" id="lovers" style="top:50%; left:60%;" onclick="goToAR('lovers')">Lovers Lane</div>
    <div class="hotspot" id="tree" style="top:70%; left:40%;" onclick="goToAR('tree')">Tree</div>
  </div>

  <script>
    // Retrieve collected hotspots from localStorage
    const collected = JSON.parse(localStorage.getItem('collected') || '{}');

    ['law','lovers','tree'].forEach(id => {
      if (collected[id]) {
        document.getElementById(id).classList.add('collected');
      }
    });

    function goToAR(location) {
      // Redirect to AR scene and pass location as a query
      window.location.href = `ar.html?highlight=${location}`;
    }
  </script>

</body>
</html>
