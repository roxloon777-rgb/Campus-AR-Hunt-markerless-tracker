<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Treasure Hunt Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background: #f0f0f0;
      overflow: hidden;
    }

    #mapContainer {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #mapImage {
      width: auto;
      height: 100%;
      max-width: 100%;
      display: block;
    }

    .hotspot {
      position: absolute;
      background: rgba(109, 62, 146, 0.8);
      color: white;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-size: 14px;
      transition: background 0.3s;
    }

    .collected {
      background: rgba(0, 200, 0, 0.8);
    }

    #userDot {
      position: absolute;
      width: 18px;
      height: 18px;
      background: rgba(0, 150, 255, 0.9);
      border: 2px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    #directionArrow {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 20px solid rgba(0, 150, 255, 0.9);
      transform-origin: 50% 100%;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="mapContainer">
  <img id="mapImage" src="assets/Map2.png" alt="Map">

  <div class="hotspot" id="law">Calvyn Fountain</div>
  <div class="hotspot" id="lovers">Lover's Lane</div>
  <div class="hotspot" id="tree">AcaciaTree</div>

  <div id="userDot"></div>
  <div id="directionArrow"></div>
</div>

<script>
  const MAP_WIDTH = 3508;
  const MAP_HEIGHT = 2481;

  const gpsHotspots = [
    { id: 'law', lat: -26.688733, lon: 27.091227, x: 1384, y: 708 },
    { id: 'lovers', lat: -26.689555, lon: 27.092471, x: 1888, y: 858 },
    { id: 'tree', lat: -26.688875, lon: 27.092535, x: 1202, y: 1545 }
  ];

  // Load collected status from localStorage
  const collected = JSON.parse(localStorage.getItem('collected') || '{}');

  const mapImage = document.getElementById('mapImage');

  function positionHotspots() {
    const rect = mapImage.getBoundingClientRect();
    const scaleX = rect.width / MAP_WIDTH;
    const scaleY = rect.height / MAP_HEIGHT;
    const offsetX = rect.left;
    const offsetY = rect.top;

    gpsHotspots.forEach(h => {
      const el = document.getElementById(h.id);
      const x = offsetX + h.x * scaleX;
      const y = offsetY + h.y * scaleY;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      if (collected[h.id]) el.classList.add('collected');

      el.onclick = () => {
        window.location.href = `ar.html?id=${h.id}&lat=${h.lat}&lon=${h.lon}`;
      }
    });
  }

  function updateUserPosition(lat, lon) {
    const rect = mapImage.getBoundingClientRect();
    const scaleX = rect.width / MAP_WIDTH;
    const scaleY = rect.height / MAP_HEIGHT;
    const offsetX = rect.left;
    const offsetY = rect.top;

    // Convert GPS to map pixels
    gpsHotspots.forEach(h => {
      const distance = Math.sqrt((lat - h.lat)**2 + (lon - h.lon)**2);
      if(distance < 0.00005) { // Rough small distance to mark collected
        if(!collected[h.id]) {
          collected[h.id] = true;
          localStorage.setItem('collected', JSON.stringify(collected));
          document.getElementById(h.id).classList.add('collected');
        }
      }
    });

    // Update user dot
    const firstHotspot = gpsHotspots[0]; // approximate conversion
    const xRatio = (lon - firstHotspot.lon) / 0.001; // rough scale
    const yRatio = (firstHotspot.lat - lat) / 0.001;
    const dot = document.getElementById('userDot');
    dot.style.left = `${dot.offsetLeft + xRatio*100}px`;
    dot.style.top = `${dot.offsetTop + yRatio*100}px`;
  }

  // Watch user's GPS
  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(
      pos => {
        const { latitude, longitude } = pos.coords;
        updateUserPosition(latitude, longitude);
      },
      err => console.warn('GPS error:', err),
      { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
  } else {
    alert("GPS not supported on this device.");
  }

  window.addEventListener('resize', positionHotspots);
  mapImage.onload = positionHotspots;
  positionHotspots(); // initial positioning
</script>

</body>
</html>
