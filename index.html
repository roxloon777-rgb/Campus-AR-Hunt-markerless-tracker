<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Treasure Hunt Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background-color: #000;
      overflow: hidden;
    }

    #map {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #map img {
      max-width: 100%;
      max-height: 100%;
      height: auto;
      width: auto;
      display: block;
    }

    .hotspot {
      position: absolute;
      background: rgba(109, 62, 146, 0.8);
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transform: translate(-50%, -50%);
      transition: transform 0.3s ease;
    }

    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .collected {
      background: rgba(0, 200, 0, 0.8);
    }
  </style>
</head>
<body>

  <div id="map">
    <img id="mapImage" src="assets/Map2.png" alt="Map">
  </div>

  <script>
    const hotspotData = [
      { id: 'law', x: 1447, y: 593, label: 'Law Fountain' },
      { id: 'lovers', x: 1883, y: 960, label: 'Lovers Lane' },
      { id: 'tree', x: 1184, y: 1436, label: 'Tree' }
    ];

    const collected = JSON.parse(localStorage.getItem('collected') || '{}');
    const map = document.getElementById('map');
    const mapImage = document.getElementById('mapImage');

    // Once the image loads, we can scale the hotspots properly
    mapImage.addEventListener('load', () => {
      const imgWidth = mapImage.naturalWidth;
      const imgHeight = mapImage.naturalHeight;

      hotspotData.forEach(hs => {
        const hotspot = document.createElement('div');
        hotspot.classList.add('hotspot');
        hotspot.id = hs.id;
        hotspot.textContent = hs.label;

        if (collected[hs.id]) hotspot.classList.add('collected');

        // Append hotspot
        map.appendChild(hotspot);

        // Position hotspot relative to actual image size
        positionHotspot(hotspot, hs.x, hs.y, imgWidth, imgHeight);
        hotspot.addEventListener('click', () => goToAR(hs.id));
      });
    });

    function positionHotspot(el, x, y, imgWidth, imgHeight) {
      const rect = mapImage.getBoundingClientRect();
      const scaleX = rect.width / imgWidth;
      const scaleY = rect.height / imgHeight;

      const left = rect.left + x * scaleX;
      const top = rect.top + y * scaleY;

      el.style.left = `${left}px`;
      el.style.top = `${top}px`;
    }

    function goToAR(location) {
      window.location.href = `ar.html?highlight=${location}`;
    }

    // Recalculate on resize
    window.addEventListener('resize', () => {
      const imgWidth = mapImage.naturalWidth;
      const imgHeight = mapImage.naturalHeight;
      hotspotData.forEach(hs => {
        const el = document.getElementById(hs.id);
        if (el) positionHotspot(el, hs.x, hs.y, imgWidth, imgHeight);
      });
    });
  </script>

</body>
</html>
