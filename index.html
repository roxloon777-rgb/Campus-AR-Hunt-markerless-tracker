<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Treasure Hunt Map (Live Test)</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: sans-serif;
    }
    #map {
      position: relative;
      width: 100%; height: 100vh;
      background: url('assets/Map.png') center/cover no-repeat;
    }
    .hotspot {
      position: absolute;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      transform: translate(-50%, -50%);
      font-weight: bold;
    }
    .collected {
      background: rgba(0, 200, 0, 0.8);
    }
    #user {
      position: absolute;
      width: 20px; height: 20px;
      background: blue;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid white;
    }
  </style>
</head>
<body>

<div id="map">
  <div class="hotspot" id="law" style="top:40%; left:30%;" onclick="goToAR('law')">Law Fountain</div>
  <div class="hotspot" id="lovers" style="top:50%; left:45%;" onclick="goToAR('lovers')">Lovers Lane</div>
  <div class="hotspot" id="tree" style="top:50%; left:60%;" onclick="goToAR('tree')">Tree</div>
  <div id="user"></div>
</div>

<script>
const map = document.getElementById('map');
const userMarker = document.getElementById('user');

// Fake map center = your coordinate
const mapCenter = { lat: -26.727530676958416, lon: 27.115707198866335 };

// Fake hotspots near your coordinate
const hotspots = {
  law: { lat: -26.7270, lon: 27.1150 },
  lovers: { lat: -26.7280, lon: 27.1160 },
  tree: { lat: -26.7273, lon: 27.1170 }
};

// Convert lat/lon difference into % on the map
function positionOnMap(lat, lon) {
  const latDiff = (lat - mapCenter.lat) * 10000; // scale for visible spacing
  const lonDiff = (lon - mapCenter.lon) * 10000;
  const top = 50 - latDiff;
  const left = 50 + lonDiff;
  return { top, left };
}

// Set hotspot positions
for (const id in hotspots) {
  const pos = positionOnMap(hotspots[id].lat, hotspots[id].lon);
  const el = document.getElementById(id);
  el.style.top = `${pos.top}%`;
  el.style.left = `${pos.left}%`;
}

// Live GPS tracking
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(pos => {
    const { latitude, longitude } = pos.coords;
    const userPos = positionOnMap(latitude, longitude);
    userMarker.style.top = `${userPos.top}%`;
    userMarker.style.left = `${userPos.left}%`;
  }, err => {
    console.warn('GPS error:', err);
    alert('Unable to access location. Please allow GPS permissions.');
  }, { enableHighAccuracy: true });
}

// Keep your collected system
const collected = JSON.parse(localStorage.getItem('collected') || '{}');
['law','lovers','tree'].forEach(id => {
  if(collected[id]) document.getElementById(id).classList.add('collected');
});

function goToAR(location) {
  window.location.href = `ar.html?highlight=${location}`;
}
</script>
</body>
</html>
