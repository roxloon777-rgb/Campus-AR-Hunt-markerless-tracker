<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Treasure Hunt Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background: #f0f0f0;
      overflow: hidden;
    }

    #mapContainer {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #mapImage {
      width: auto;
      height: 100%;
      max-width: 100%;
      display: block;
    }

    .hotspot {
      position: absolute;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-size: 14px;
    }

    .collected {
      background: rgba(0, 200, 0, 0.8);
    }

    #userDot {
      position: absolute;
      width: 18px;
      height: 18px;
      background: rgba(0, 150, 255, 0.9);
      border: 2px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    #directionArrow {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 20px solid rgba(0, 150, 255, 0.9);
      transform-origin: 50% 100%;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="mapContainer">
  <img id="mapImage" src="assets/Map2.png" alt="Map">

  <div class="hotspot" id="law">Law Fountain</div>
  <div class="hotspot" id="lovers">Lovers Lane</div>
  <div class="hotspot" id="tree">Tree</div>

  <div id="userDot"></div>
  <div id="directionArrow"></div>
</div>

<script>
  const MAP_WIDTH = 3508;
  const MAP_HEIGHT = 2481;

  const gpsHotspots = [
    { id: 'law', lat: -26.688733, lon: 27.091227, x: 1447, y: 593 },
    { id: 'lovers', lat: -26.689555, lon: 27.092471, x: 1883, y: 960 },
    { id: 'tree', lat: -26.688875, lon: 27.092535, x: 1184, y: 1436 }
  ];

  const collected = JSON.parse(localStorage.getItem('collected') || '{}');
  const mapImage = document.getElementById('mapImage');

  // Get GPS bounds (min/max lat/lon)
  const minLat = Math.min(...gpsHotspots.map(h => h.lat));
  const maxLat = Math.max(...gpsHotspots.map(h => h.lat));
  const minLon = Math.min(...gpsHotspots.map(h => h.lon));
  const maxLon = Math.max(...gpsHotspots.map(h => h.lon));

  function latLonToXY(lat, lon) {
    const xRatio = (lon - minLon) / (maxLon - minLon);
    const yRatio = (maxLat - lat) / (maxLat - minLat);
    const x = gpsHotspots[0].x + xRatio * (gpsHotspots[1].x - gpsHotspots[0].x); // approximate mapping
    const y = gpsHotspots[0].y + yRatio * (gpsHotspots[2].y - gpsHotspots[0].y);
    return { x, y };
  }

  function positionHotspots() {
    const rect = mapImage.getBoundingClientRect();
    const scaleX = rect.width / MAP_WIDTH;
    const scaleY = rect.height / MAP_HEIGHT;
    const offsetX = rect.left;
    const offsetY = rect.top;

    gpsHotspots.forEach(h => {
      const el = document.getElementById(h.id);
      const x = offsetX + h.x * scaleX;
      const y = offsetY + h.y * scaleY;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      if (collected[h.id]) el.classList.add('collected');

      // Add click to pass coordinates to AR
      el.onclick = () => {
        window.location.href = `ar.html?lat=${h.lat}&lon=${h.lon}&id=${h.id}`;
      }
    });
  }

  function updateUserPosition(lat, lon) {
    const rect = mapImage.getBoundingClientRect();
    const scaleX = rect.width / MAP_WIDTH;
    const scaleY = rect.height / MAP_HEIGHT;
    const offsetX = rect.left;
    const offsetY = rect.top;

    const { x, y } = latLonToXY(lat, lon);
    const px = offsetX + x * scaleX;
    const py = offsetY + y * scaleY;

    const dot = document.getElementById('userDot');
    const arrow = document.getElementById('directionArrow');
    dot.style.left = `${px}px`;
    dot.style.top = `${py}px`;
    arrow.style.left = `${px}px`;
    arrow.style.top = `${py - 25}px`;
  }

  // Watch user's real GPS
  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(
      pos => {
        const { latitude, longitude } = pos.coords;
        updateUserPosition(latitude, longitude);
      },
      err => console.warn('GPS error:', err),
      { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
  } else {
    alert("GPS not supported on this device.");
  }

  window.addEventListener('resize', positionHotspots);
  mapImage.onload = positionHotspots;
</script>

</body>
</html>
