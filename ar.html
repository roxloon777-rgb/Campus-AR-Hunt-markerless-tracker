<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Treasure Hunt</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    button {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 10px 20px;
      font-size: 18px;
    }
    #takeSelfie { bottom: 20px; }
    #uploadPadlet { bottom: 70px; display:none; }
  </style>
</head>
<body>

<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  renderer="antialias: true; alpha: true; physicallyCorrectLights: true"
>
  <a-entity camera gps-camera rotation-reader></a-entity>

  <a-entity light="type: ambient; color: #ffffff; intensity: 0.6"></a-entity>
  <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>
</a-scene>

<button id="takeSelfie">Take Selfie</button>
<button id="uploadPadlet">Upload to Padlet</button>

<script>
const hotspots = [
  {id:'law', lat:-26.688737, lon:27.091276, model:"models/meet_mira.glb", message:"Well done! You found the Calvyn Fountain"},
  {id:'lovers', lat:-26.688676, lon:27.092549, model:"models/meet_mira.glb", message:"Well done! You found Lover's Lane"},
  {id:'tree', lat:-26.688878, lon:27.092565, model:"models/meet_mira.glb", message:"Well done! You found the Acacia Tree"}
];

const SHOW_DISTANCE = 20; // meters
const collected = JSON.parse(localStorage.getItem('collected') || '{}');
let lastSelfieData = null;
let lastCollected = null;

function getDistance(lat1, lon1, lat2, lon2) {
  const toRad = x => x * Math.PI / 180;
  const R = 6371e3;
  const φ1 = toRad(lat1), φ2 = toRad(lat2);
  const Δφ = toRad(lat2-lat1), Δλ = toRad(lon2-lon1);
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// Spawn a hotspot at its GPS location
function spawnHotspot(obj) {
  if (!AFRAME.utils.entity.isEntity(obj.spawned)) {
    const scene = document.querySelector('a-scene');
    const entity = document.createElement('a-entity');
    entity.setAttribute('gps-entity-place', `latitude: ${obj.lat}; longitude: ${obj.lon}`);
    entity.setAttribute('gltf-model', obj.model);
    entity.setAttribute('scale', '1 1 1');
    entity.setAttribute('rotation', '0 180 0');
    scene.appendChild(entity);
    obj.spawned = entity; // mark as spawned
  }
}

// Watch GPS
navigator.geolocation.watchPosition(pos => {
  const userLat = pos.coords.latitude;
  const userLon = pos.coords.longitude;

  hotspots.forEach(h => {
    const distance = getDistance(userLat, userLon, h.lat, h.lon);
    if(distance <= SHOW_DISTANCE && !collected[h.id]) {
      collected[h.id] = true;
      localStorage.setItem('collected', JSON.stringify(collected));
      alert(h.message);
      spawnHotspot(h);
      lastCollected = h.id;
    }
  });
}, err => console.error(err), { enableHighAccuracy: true });

// Take selfie
document.getElementById('takeSelfie').addEventListener('click', () => {
  if(!lastCollected) {
    alert('Move closer to a hotspot to take a selfie!');
    return;
  }
  const scene = document.querySelector('a-scene');
  scene.components.screenshot.capture('perspective', dataUri => {
    lastSelfieData = dataUri;
    document.getElementById('uploadPadlet').style.display = 'block';
    window.open(dataUri);
  });
});

// Upload to Padlet
document.getElementById('uploadPadlet').addEventListener('click', () => {
  if(!lastSelfieData) {
    alert('Take a selfie first!');
    return;
  }
  window.open('https://padlet.com/nwu/desmond-tutu-school-of-medicine-kcvop1gmdyzyntoq', '_blank');
  alert('Drag your selfie from the opened tab onto the Padlet wall.');
});
</script>

</body>
</html>
